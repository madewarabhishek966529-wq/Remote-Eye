name: remote_eye
description: "RemoteEye - Standalone P2P Android Screen Mirroring & Remote Control via WebRTC"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_webrtc: ^0.12.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  permission_handler: ^11.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

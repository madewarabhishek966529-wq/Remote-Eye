org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Suppress unsupported compileSdk warnings
android.suppressUnsupportedCompileSdk=36
# Keep newDsl=false for compatibility
android.newDsl=false
# Must be false — flutter_webrtc and mobile_scanner still use kotlin-android plugin
# which conflicts with AGP 9+ builtInKotlin=true mode
android.builtInKotlin=false
